services:
  postgres:
    image: postgres:16
    container_name: pg-health-lab
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthcheck_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_health_lab_data:/var/lib/postgresql/data
      # Runs only when the database volume is initialized for the first time.
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcheck_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pg_health_lab_data:
